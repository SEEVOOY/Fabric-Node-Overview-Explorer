[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-explorer"
version = "0.1.0"
description = "Explore a Microsoft Fabric workspace as a graph: lakehouses, notebooks and what they read and write"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "azure-identity>=1.15"]

[project.scripts]
fabric-explorer = "fabric_explorer.__main__:main"

[tool.setuptools]
packages = ["fabric_explorer", "fabric_explorer.parse"]

[tool.setuptools.package-data]
fabric_explorer = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
